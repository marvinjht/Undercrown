# Render Blueprint: one free web service that runs the game server and serves the game.
# Render reads this file when you choose New > Blueprint and pick this repository.
services:
  - type: web
    name: undercrown
    runtime: node
    plan: free
    buildCommand: echo "No build step needed"
    startCommand: node server/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
